[package]
name = "mcpg-plugin-cache-redis"
version = "0.1.0-alpha.15"
license = "Apache-2.0"
edition = "2024"
description = "Redis-backed mcpg cache plugin (dev.mcpg.cache.redis)"

[lib]
# cdylib: produces the `.so`/`.dylib` the gateway's native_loader
# opens via `libloading` and binds through `mcpg_plugin_register`.
# rlib: lets the workspace build + unit-test the plugin's internals
# without producing a dylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
# `static-firstparty` exposes
# `HostHandle::from_services` so the Recorder integration test
# can construct a host handle from a `HostServices` trait object
# instead of the FFI `HostHandleRef`. The cdylib build is
# unaffected — the feature only gates the in-process construction
# surface.
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13", features = ["static-firstparty"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

# Async Redis client + pool. Plugin block_on's its own runtime so each
# trait method satisfies the SyncCachePlugin bound. tokio-comp gives us
# the multiplexed async connection that deadpool wraps.
redis = { version = "0.27", features = ["tokio-comp", "script"] }
deadpool-redis = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
# testcontainers for the feature-gated integration suite (commit 3).
# Stays a dev-dep so the cdylib doesn't bundle docker glue at runtime.
# `blocking` enables the SyncRunner — the SyncCachePlugin trait is
# sync, so wiring tests through tokio::test would just add noise.
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["redis", "blocking"] }
# Recorder-based HostHandle integration tests
# need the host-side `HostServices` trait to build a test double.

async-trait = "0.1"


[features]
# Default ON so `cargo build -p mcpg-plugin-cache-redis` produces a
# working cdylib with the `mcpg_plugin_register` symbol exported.
# Disabled by callers that link the plugin as an rlib path-dep
# (avoids the multi-plugin linker collision).
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's `declare_cache_plugin!` `build_static`
# accessor (gated `#[cfg(feature = "static-firstparty")]`) does not
# trigger `unexpected_cfgs` in consumer compilation. Empty: this plugin
# is consumed as a cdylib, not via the static-firstparty fast path.
# (The dependency on `mcpg-plugin-sdk` enables `static-firstparty`
# unconditionally for the SDK so `HostHandle::from_services` is
# available to the Recorder integration test; this feature here
# stays declared-but-empty for the legacy `cfg(feature = ...)`
# accessor on the cache side.)
static-firstparty = []
# Gates the docker-backed integration tests so plain `cargo test`
# stays cheap. Run with `cargo test -p mcpg-plugin-cache-redis
# --features integration-tests`.
integration-tests = []
